<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mot de passe oublié | KONE.EDUC</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="robots" content="noindex"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--b:#1559eb;--o:#fa7518;--n:#102149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#eef5ff,#fff8ef);font-family:'DM Sans',sans-serif;color:var(--n)}.box{width:min(100%,455px);padding:38px;border-radius:22px;background:#fff;box-shadow:0 22px 60px #ccd9ee}.brand{font:800 28px Manrope,sans-serif;color:var(--b);text-decoration:none}.brand b{color:var(--o)}h1{margin:27px 0 8px;font:800 31px Manrope,sans-serif}p{color:#56627d;line-height:1.5}label{display:block;margin-top:17px;font-weight:700}input{width:100%;margin-top:7px;padding:13px;border:1px solid #d7e1f2;border-radius:10px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;color:#fff;background:var(--b);font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:24px;color:#b42318;font-size:14px}.foot{text-align:center;font-size:14px}.ok{color:#11743a!important}.foot a{color:var(--b);font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="index.html" style="display:inline-flex;align-items:center;gap:9px"><img src="favicon.svg" alt="" width="34" height="34"><span>KONE.<b>EDUC</b></span></a><h1>Mot de passe oublié</h1><p>Indiquez l’adresse e-mail de votre compte : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p><form id="form"><label>Adresse e-mail<input id="email" type="email" autocomplete="email" required></label><button>Envoyer le lien</button></form><p id="msg" class="msg" role="status"></p><p class="foot"><a href="connexion.html">← Retour à la connexion</a></p></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;msg.className='msg';msg.textContent='';const r=await db.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:new URL('nouveau-mot-de-passe.html',location.href).href});b.disabled=false;if(r.error){msg.textContent='Envoi impossible pour le moment. Réessayez dans quelques minutes.';return}msg.className='msg ok';msg.textContent='Si un compte existe avec cette adresse, un e-mail vient de vous être envoyé. Pensez à vérifier vos courriers indésirables.';form.reset()}</script></body></html>
