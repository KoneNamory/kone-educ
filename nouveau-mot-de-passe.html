<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe | KONE.EDUC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KONE.EDUC"><meta name="theme-color" content="#1559eb"><link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48"><meta name="robots" content="noindex"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--b:#1559eb;--o:#fa7518;--n:#102149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#eef5ff,#fff8ef);font-family:'DM Sans',sans-serif;color:var(--n)}.box{width:min(100%,455px);padding:38px;border-radius:22px;background:#fff;box-shadow:0 22px 60px #ccd9ee}.brand{font:800 28px Manrope,sans-serif;color:var(--b);text-decoration:none}.brand b{color:var(--o)}h1{margin:27px 0 8px;font:800 31px Manrope,sans-serif}p{color:#56627d;line-height:1.5}label{display:block;margin-top:17px;font-weight:700}input{width:100%;margin-top:7px;padding:13px;border:1px solid #d7e1f2;border-radius:10px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;color:#fff;background:var(--b);font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:24px;color:#b42318;font-size:14px}.foot{text-align:center;font-size:14px}.ok{color:#11743a!important}.foot a{color:var(--b);font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="index.html" style="display:inline-flex;align-items:center;gap:9px"><img src="assets/logo/kone-educ-embleme.jpg" alt="" width="42" height="42"><span>KONE.<b>EDUC</b></span></a><h1>Nouveau mot de passe</h1><p>Choisissez un nouveau mot de passe d’au moins 6 caractères.</p><form id="form"><label>Nouveau mot de passe<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label>Confirmez le mot de passe<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></label><button>Enregistrer</button></form><p id="msg" class="msg" role="status"></p><p class="foot"><a href="connexion.html">← Retour à la connexion</a></p></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);form.onsubmit=async e=>{e.preventDefault();msg.className='msg';if(password.value!==confirmPassword.value){msg.textContent='Les deux mots de passe ne sont pas identiques.';return}const{data:{session}}=await db.auth.getSession();if(!session){msg.innerHTML='Ce lien a expiré ou a déjà été utilisé. <a href="mot-de-passe-oublie.html">Demander un nouveau lien</a>.';return}const b=form.querySelector('button');b.disabled=true;const r=await db.auth.updateUser({password:password.value});b.disabled=false;if(r.error){msg.textContent='Erreur : '+r.error.message;return}msg.className='msg ok';msg.textContent='Mot de passe modifié. Redirection vers la connexion...';await db.auth.signOut();setTimeout(()=>location.href='connexion.html',1800)}</script></body></html>
