<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f8ff;font:16px Arial;color:#102149}main{max-width:1000px;margin:auto;padding:30px}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.row{padding:15px;border-top:1px solid #dbe5f5}.tag{float:right;padding:5px 8px;border-radius:12px;color:#a65d00;background:#fff0dc;font-size:11px;font-weight:bold}.ok{color:#168044;background:#e7f8ec}.btn{margin:5px;padding:9px;border:0;border-radius:7px;color:#fff;background:#1559eb;font-weight:bold}a{text-decoration:none;color:#1559eb;font-weight:bold}</style></head><body><main><a href="index.html">← Accueil</a><h1>Administration KONE.EDUC</h1><p id="message">Chargement...</p><section class="card"><h2>Demandes de cours</h2><div id="requests"></div></section><section class="card"><h2>Candidatures Enseignant</h2><div id="teachers"></div></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),msg=document.getElementById('message');async function load(){const q=await db.from('course_requests').select('*').order('created_at',{ascending:false}),t=await db.from('teacher_profiles').select('*');if(q.error||t.error){msg.textContent='Accès Administrateur requis.';return}msg.textContent='Données chargées.';requests.innerHTML=q.data.map(r=>'<div class="row"><span class="tag">'+r.status+'</span><b>'+r.student_name+' · '+r.subject+'</b><br><small>'+r.school_level+' · '+r.location+'</small></div>').join('')||'Aucune demande.';teachers.innerHTML=t.data.map(x=>'<div class="row"><span class="tag '+(x.approved?'ok':'')+'">'+(x.approved?'Validé':'À valider')+'</span><b>'+x.subject+' · '+x.degree+'</b><br><small>'+x.experience+' · '+x.availability+'</small><br><button class="btn" onclick="approve(\''+x.id+'\')">Valider</button></div>').join('')||'Aucune candidature.'}async function approve(id){const r=await db.from('teacher_profiles').update({approved:true}).eq('id',id);if(r.error){alert(r.error.message);return}load()}load()</script></body></html>
