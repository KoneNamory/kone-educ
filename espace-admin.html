<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f8ff;font:16px Arial;color:#102149}main{max-width:1000px;margin:auto;padding:30px}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.row{padding:15px;border-top:1px solid #dbe5f5}.tag{float:right;padding:5px 8px;border-radius:12px;color:#a65d00;background:#fff0dc;font-size:11px;font-weight:bold}.empty{color:#596580}.btn{padding:10px;border:0;border-radius:7px;color:#fff;background:#1559eb;font-weight:bold}a{text-decoration:none;color:#1559eb;font-weight:bold}</style></head><body><main><a href="index.html">← Accueil</a><h1>Administration KONE.EDUC</h1><p id="message">Chargement des demandes...</p><section class="card"><h2>Demandes de cours réelles</h2><div id="requests"></div></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),box=document.getElementById('requests'),msg=document.getElementById('message');async function load(){const{data:{user}}=await db.auth.getUser();if(!user){msg.textContent='Connectez-vous avec un compte administrateur.';return}const{data,error}=await db.from('course_requests').select('*').order('created_at',{ascending:false});if(error){msg.textContent='Accès refusé : votre compte doit être administrateur.';return}msg.textContent=data.length+' demande(s) chargée(s).';box.innerHTML=data.length?data.map(r=>'<div class="row"><span class="tag">'+r.status+'</span><b>'+r.student_name+' · '+r.subject+'</b><br><small>'+r.school_level+' · '+r.location+' · '+r.format+'</small><p>'+r.availability+'</p></div>').join(''):'<p class="empty">Aucune demande pour le moment.</p>'}load()</script></body></html>
