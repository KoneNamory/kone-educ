<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration | KONE.EDUC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KONE.EDUC"><meta name="theme-color" content="#1559eb"><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#102149;--blue:#1559eb;--paper:#f4f8ff;--line:#dbe5f5;--green:#168044}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px Georgia,serif;color:var(--ink)}main{max-width:1050px;margin:auto;padding:32px 24px}.back{color:var(--blue);font-weight:bold;text-decoration:none}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:#6076a8;font:700 12px Arial,sans-serif;margin:25px 0 7px}h1,h2{margin:0;font-family:Georgia,serif}h1{font-size:42px}.lead{color:#566786}.card{background:#fff;padding:25px;margin:20px 0;border-radius:18px;border:1px solid #edf1f8;box-shadow:0 12px 30px rgba(25,61,125,.06)}.row{padding:17px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.row:first-child{border-top:0}.tag{display:inline-block;padding:5px 9px;border-radius:99px;color:#9a5900;background:#fff0dc;font:700 11px Arial,sans-serif}.tag.ok{color:#11743a;background:#e7f8ec}.btn,select{border-radius:8px;font:700 14px Arial,sans-serif}.btn{padding:10px 13px;border:0;color:#fff;background:var(--blue);cursor:pointer}.assign{display:flex;gap:8px;align-items:center}.assign select{max-width:215px;padding:9px;border:1px solid var(--line);background:#fff;color:var(--ink)}small{color:#66769a}@media(max-width:650px){h1{font-size:34px}.row{grid-template-columns:1fr}.assign{flex-wrap:wrap}.assign select{max-width:100%;width:100%}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.kpi{padding:16px 18px;border-radius:16px;background:#fff;border:1px solid #e3ebf8}.kpi b{display:block;font:800 28px Manrope,Arial,sans-serif}.kpi span{color:#5a6a8a;font:13px Arial,sans-serif}.who{margin-top:6px;font:14px Arial,sans-serif}.who a{margin-left:10px;font-weight:bold;text-decoration:none;color:#1559eb}.who a[href*="wa.me"]{color:#128c4b}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}.btn.ghost{background:#fff;color:#1559eb;border:1px solid #cfdcf5}.btn.ghost.danger{color:#b42318;border-color:#f1c7c2}.assign{flex-wrap:wrap}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body><main><button type="button" onclick="db.auth.signOut().then(()=>location.href='connexion.html')" style="float:right;padding:8px 12px;border:1px solid #dbe5f5;border-radius:8px;background:#fff;color:#102149;font:bold 14px Arial;cursor:pointer">Se déconnecter</button><a class="back" href="index.html">← Accueil</a><p class="eyebrow">KONE.EDUC · Gestion</p><h1>Administration</h1><p><a class="back" href="gestion-documents.html">📁 Gérer les documents</a></p><p class="lead" id="message">Chargement des données...</p><div class="kpis"><div class="kpi"><b id="kPending">–</b><span>demande(s) en attente d’enseignant</span></div><div class="kpi"><b id="kTeachers">–</b><span>candidature(s) à valider</span></div><div class="kpi"><b id="kInvoices">–</b><span>paiement(s) à vérifier</span></div><div class="kpi"><b id="kContacts">–</b><span>message(s) de contact</span></div></div><section class="card"><h2>Demandes de cours</h2><div id="requests"></div></section><section class="card"><h2>Candidatures Enseignant</h2><div id="teachers"></div></section><section class="card"><h2>Facturation mensuelle</h2><form id="invoiceForm" class="assign" style="margin:12px 0 6px"><select id="invCourse" required></select><input id="invMonth" type="month" required style="padding:8px;border:1px solid var(--line);border-radius:8px"><input id="invAmount" type="number" min="1" required placeholder="Montant FCFA" style="width:140px;padding:8px;border:1px solid var(--line);border-radius:8px"><button class="btn">Créer la facture</button></form><div id="invoices"></div></section><section class="card"><h2>Messages de contact</h2><div id="contacts"></div></section></main>
<script>
const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),msg=document.getElementById('message');let approved=[],requestsData=[];

const statusFr={pending:'En attente',assigned:'Enseignant attribué',completed:'Terminé',cancelled:'Annulé'};const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let people={};const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10&&d[0]==='0')d='225'+d;return d};
function who(id,label){const p=people[id];if(!p)return '';return '<div class="who">'+label+' : <b>'+safe(p.full_name)+'</b>'+(p.phone?' · '+safe(p.phone)+'<a href="tel:'+safe(p.phone.replace(/\s/g,''))+'">📞 Appeler</a><a href="https://wa.me/'+waNum(p.phone)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</div>'}
function options(selected){return '<option value="">Choisir un enseignant</option>'+approved.map(t=>'<option value="'+t.id+'" '+(t.id===selected?'selected':'')+'>'+(people[t.id]?safe(people[t.id].full_name)+' · ':'')+safe(t.subject||'Matière non indiquée')+' · '+safe(t.degree||'Diplôme non indiqué')+'</option>').join('')}
async function load(){const[q,t,rv]=await Promise.all([db.from('course_requests').select('*').order('created_at',{ascending:false}),db.from('teacher_profiles').select('*'),db.from('reviews').select('teacher_id,rating'),db.from('profiles').select('id,full_name,phone,role')]).then(r=>{people={};(r[3].data||[]).forEach(p=>people[p.id]=p);return r});const stars=id=>{const l=(rv.data||[]).filter(x=>x.teacher_id===id);return l.length?' · ⭐ '+(l.reduce((a,x)=>a+x.rating,0)/l.length).toLocaleString('fr-FR',{maximumFractionDigits:1})+'/5 ('+l.length+' avis)':''};if(q.error||t.error){msg.textContent='Accès Administrateur requis. '+(q.error||t.error).message;return}requestsData=q.data;approved=t.data.filter(x=>x.approved);kPending.textContent=q.data.filter(r=>r.status==='pending').length;kTeachers.textContent=t.data.filter(x=>!x.approved).length;msg.textContent=q.data.length+' demande(s) · '+approved.length+' enseignant(s) validé(s).';requests.innerHTML=q.data.map(r=>'<div class="row"><div><span class="tag '+(r.status==='assigned'||r.status==='completed'?'ok':'')+'">'+safe(statusFr[r.status]||r.status)+'</span><h3>'+safe(r.student_name)+' · '+safe(r.subject)+'</h3><small>'+safe(r.school_level)+' · '+safe(r.location)+' · '+safe(r.format)+'<br>'+safe(r.availability)+'</small>'+who(r.parent_id,'Parent')+who(r.teacher_id,'Enseignant')+(r.teacher_id?'<br><a class="back" href="suivi.html?cours='+r.id+'">📈 Suivi</a>':'')+'</div><div class="assign"><select id="teacher-'+r.id+'">'+options(r.teacher_id)+'</select><button class="btn" onclick="assignTeacher('+r.id+')">Attribuer</button>'+(r.status==='assigned'?'<button class="btn ghost" onclick="setStatus('+r.id+',\'completed\')">Terminé</button>':'')+(r.status==='pending'||r.status==='assigned'?'<button class="btn ghost danger" onclick="setStatus('+r.id+',\'cancelled\')">Annuler</button>':'')+'</div></div>').join('')||'<p>Aucune demande.</p>';loadInvoices();teachers.innerHTML=t.data.map(x=>'<div class="row"><div><span class="tag '+(x.approved?'ok':'')+'">'+(x.approved?'Validé':'À valider')+'</span><h3>'+safe(x.subject)+' · '+safe(x.degree)+'</h3><small>'+safe(x.experience)+' · '+safe(x.availability)+stars(x.id)+'</small>'+who(x.id,'Enseignant')+'</div><div>'+(x.approved?'':'<button class="btn" onclick="approve(\''+x.id+'\')">Valider</button>')+'</div></div>').join('')||'<p>Aucune candidature.</p>'}
async function loadContacts(){const c=await db.from('contact_messages').select('*').order('created_at',{ascending:false});kContacts.textContent=c.error?'–':c.data.length;contacts.innerHTML=c.error?'<p>Les messages seront disponibles après la mise à jour du schéma Supabase.</p>':c.data.map(m=>'<div class="row"><div><span class="tag">'+safe(m.subject)+'</span><h3>'+safe(m.name)+'</h3><small><a href="mailto:'+safe(m.email)+'">'+safe(m.email)+'</a> · '+new Date(m.created_at).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})+'</small><p style="white-space:pre-wrap">'+safe(m.message)+'</p></div></div>').join('')||'<p>Aucun message.</p>'}
const fcfa=n=>Number(n).toLocaleString('fr-FR')+' FCFA',invStatus={unpaid:'À payer',pending:'À vérifier',paid:'Payée'},invMethod={wave:'Wave',orange_money:'Orange Money',moov_money:'Moov Money'};
async function loadInvoices(){const assigned=requestsData.filter(r=>r.teacher_id&&r.parent_id&&r.status==='assigned');invCourse.innerHTML='<option value="">Choisir un cours attribué</option>'+assigned.map(r=>'<option value="'+r.id+'">'+safe(r.student_name)+' · '+safe(r.subject)+'</option>').join('');if(!invMonth.value)invMonth.value=new Date().toISOString().slice(0,7);const v=await db.from('invoices').select('*').order('month',{ascending:false}).order('created_at',{ascending:false});kInvoices.textContent=v.error?'–':v.data.filter(i=>i.status==='pending').length;if(v.error){invoices.innerHTML='<p>La facturation sera disponible après la mise à jour du schéma Supabase.</p>';return}invoices.innerHTML=v.data.map(i=>{const r=requestsData.find(x=>x.id===i.course_request_id)||{};return'<div class="row"><div><span class="tag '+(i.status==='paid'?'ok':'')+'">'+invStatus[i.status]+'</span><h3>'+safe(r.student_name)+' · '+safe(r.subject)+' — '+fcfa(i.amount)+'</h3><small>Mois '+i.month.slice(5,7)+'/'+i.month.slice(0,4)+(i.payment_reference?' · '+safe(invMethod[i.payment_method])+' réf. '+safe(i.payment_reference):'')+'</small></div><div>'+(i.status!=='paid'?'<button class="btn" onclick="markPaid('+i.id+')">'+(i.status==='pending'?'Confirmer le paiement':'Marquer payée')+'</button>':'')+'</div></div>'}).join('')||'<p>Aucune facture.</p>'}
invoiceForm.onsubmit=async e=>{e.preventDefault();const r=requestsData.find(x=>x.id===Number(invCourse.value));const v=await db.from('invoices').insert({course_request_id:r.id,parent_id:r.parent_id,month:invMonth.value+'-01',amount:Number(invAmount.value)});if(v.error){alert(v.error.code==='23505'?'Une facture existe déjà pour ce cours et ce mois.':v.error.message);return}invAmount.value='';loadInvoices()};
async function markPaid(id){if(!confirm('Confirmer que ce paiement a bien été reçu ?'))return;const v=await db.from('invoices').update({status:'paid'}).eq('id',id);if(v.error){alert(v.error.message);return}loadInvoices()}
async function approve(id){const r=await db.from('teacher_profiles').update({approved:true}).eq('id',id);if(r.error){alert(r.error.message);return}load()}
async function setStatus(id,status){if(!confirm(status==='completed'?'Marquer cet accompagnement comme terminé ?':'Annuler cette demande ?'))return;const r=await db.from('course_requests').update({status}).eq('id',id);if(r.error){alert(r.error.message);return}load()}
async function assignTeacher(id){const teacherId=document.getElementById('teacher-'+id).value;if(!teacherId){alert('Choisissez un enseignant validé.');return}const request=requestsData.find(x=>x.id===id);const r=await db.from('course_requests').update({teacher_id:teacherId,status:'assigned'}).eq('id',id);if(r.error){alert(r.error.message);return}const text='Cours de '+request.subject+' pour '+request.student_name+' · '+request.availability;const n=await db.from('notifications').insert([{recipient_id:teacherId,title:'Nouveau cours attribué',body:text},{recipient_id:request.parent_id,title:'Enseignant attribué',body:'Un enseignant a été attribué à la demande de '+request.student_name+'.'}]);if(n.error){alert('Cours attribué, mais notification non créée : '+n.error.message)}load()}
load();loadContacts();
</script><script src="app.js"></script></body></html>
