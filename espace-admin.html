<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#102149;--blue:#1559eb;--paper:#f4f8ff;--line:#dbe5f5;--green:#168044}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px Georgia,serif;color:var(--ink)}main{max-width:1050px;margin:auto;padding:32px 24px}.back{color:var(--blue);font-weight:bold;text-decoration:none}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:#6076a8;font:700 12px Arial,sans-serif;margin:25px 0 7px}h1,h2{margin:0;font-family:Georgia,serif}h1{font-size:42px}.lead{color:#566786}.card{background:#fff;padding:25px;margin:20px 0;border-radius:18px;border:1px solid #edf1f8;box-shadow:0 12px 30px rgba(25,61,125,.06)}.row{padding:17px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.row:first-child{border-top:0}.tag{display:inline-block;padding:5px 9px;border-radius:99px;color:#9a5900;background:#fff0dc;font:700 11px Arial,sans-serif}.tag.ok{color:#11743a;background:#e7f8ec}.btn,select{border-radius:8px;font:700 14px Arial,sans-serif}.btn{padding:10px 13px;border:0;color:#fff;background:var(--blue);cursor:pointer}.assign{display:flex;gap:8px;align-items:center}.assign select{max-width:215px;padding:9px;border:1px solid var(--line);background:#fff;color:var(--ink)}small{color:#66769a}@media(max-width:650px){h1{font-size:34px}.row{grid-template-columns:1fr}.assign{flex-wrap:wrap}.assign select{max-width:100%;width:100%}}
</style></head><body><main><a class="back" href="index.html">← Accueil</a><p class="eyebrow">KONE.EDUC · Gestion</p><h1>Administration</h1><p class="lead" id="message">Chargement des données...</p><section class="card"><h2>Demandes de cours</h2><div id="requests"></div></section><section class="card"><h2>Candidatures Enseignant</h2><div id="teachers"></div></section></main>
<script>
const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),msg=document.getElementById('message');let approved=[];
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(selected){return '<option value="">Choisir un enseignant</option>'+approved.map(t=>'<option value="'+t.id+'" '+(t.id===selected?'selected':'')+'>'+safe(t.subject||'Matière non indiquée')+' · '+safe(t.degree||'Diplôme non indiqué')+'</option>').join('')}
async function load(){const[q,t]=await Promise.all([db.from('course_requests').select('*').order('created_at',{ascending:false}),db.from('teacher_profiles').select('*')]);if(q.error||t.error){msg.textContent='Accès Administrateur requis. '+(q.error||t.error).message;return}approved=t.data.filter(x=>x.approved);msg.textContent=q.data.length+' demande(s) · '+approved.length+' enseignant(s) validé(s).';requests.innerHTML=q.data.map(r=>'<div class="row"><div><span class="tag '+(r.status==='assigned'?'ok':'')+'">'+safe(r.status)+'</span><h3>'+safe(r.student_name)+' · '+safe(r.subject)+'</h3><small>'+safe(r.school_level)+' · '+safe(r.location)+' · '+safe(r.format)+'<br>'+safe(r.availability)+'</small></div><div class="assign"><select id="teacher-'+r.id+'">'+options(r.teacher_id)+'</select><button class="btn" onclick="assignTeacher('+r.id+')">Attribuer</button></div></div>').join('')||'<p>Aucune demande.</p>';teachers.innerHTML=t.data.map(x=>'<div class="row"><div><span class="tag '+(x.approved?'ok':'')+'">'+(x.approved?'Validé':'À valider')+'</span><h3>'+safe(x.subject)+' · '+safe(x.degree)+'</h3><small>'+safe(x.experience)+' · '+safe(x.availability)+'</small></div><div>'+(x.approved?'':'<button class="btn" onclick="approve(\''+x.id+'\')">Valider</button>')+'</div></div>').join('')||'<p>Aucune candidature.</p>'}
async function approve(id){const r=await db.from('teacher_profiles').update({approved:true}).eq('id',id);if(r.error){alert(r.error.message);return}load()}
async function assignTeacher(id){const teacherId=document.getElementById('teacher-'+id).value;if(!teacherId){alert('Choisissez un enseignant validé.');return}const r=await db.from('course_requests').update({teacher_id:teacherId,status:'assigned'}).eq('id',id);if(r.error){alert(r.error.message);return}load()}
load();
</script></body></html>
