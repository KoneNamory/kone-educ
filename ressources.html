<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes documents | KONE.EDUC</title><meta name="robots" content="noindex"><meta name="theme-color" content="#1559eb"><link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="dash.css">
<style>
.doc{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}.doc:first-child{border-top:0;padding-top:4px}
.doc .ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:#eaf1ff;font-size:22px}
.doc.mine .ic{background:#fff1dc}
.doc-main{flex:1;min-width:0}.doc-main b{font-size:16px}
.doc-main p{margin:4px 0 0;color:#3c4b6b;font-size:14px;white-space:pre-wrap}
.doc .d-btn{flex:none}
@media(max-width:600px){.doc{flex-wrap:wrap}.doc .d-btn{width:100%;justify-content:center}}
</style></head><body><main>
<section class="d-hero"><div><p class="eyebrow">Ressources</p><h1>Mes documents</h1><p id="message">Chargement…</p></div><div class="d-hero-cta"><a class="d-btn light" id="back" href="index.html">← Mon espace</a></div></section>
<section class="card d-card" style="margin-top:18px"><div class="d-head"><h2>Documents disponibles</h2><span class="d-count" id="count">0</span></div><div id="list"></div></section>
</main>
<script>
const db = supabase.createClient(KONE_EDUC_SUPABASE.url, KONE_EDUC_SUPABASE.publishableKey);
const safe = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = { pdf: '📕', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊', ppt: '📽', pptx: '📽', jpg: '🖼', jpeg: '🖼', png: '🖼', mp3: '🎧', mp4: '🎬' };
let docs = [];
async function load() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) { message.innerHTML = '<a href="connexion.html" style="color:#fff">Connectez-vous</a> pour consulter vos documents.'; return; }
  const me = (await db.from('profiles').select('role').eq('id', user.id).maybeSingle()).data || {};
  back.href = { parent: 'espace-parent.html', teacher: 'espace-enseignant.html', admin: 'espace-admin.html' }[me.role] || 'index.html';
  if (me.role === 'admin') { back.insertAdjacentHTML('beforebegin', '<a class="d-btn orange" href="gestion-documents.html">+ Envoyer un document</a>'); }
  const r = await db.from('documents').select('*').order('created_at', { ascending: false });
  docs = r.error ? [] : r.data;
  const mine = docs.filter(d => d.recipient_id === user.id).length;
  count.textContent = docs.length;
  message.textContent = docs.length ? docs.length + ' document(s) disponible(s)' + (mine ? ', dont ' + mine + ' envoyé(s) rien que pour vous.' : '.') : 'Les documents envoyés par KONE.EDUC apparaîtront ici.';
  list.innerHTML = docs.map((d, i) => {
    const ext = String(d.file_name).split('.').pop().toLowerCase(), own = d.recipient_id === user.id;
    return '<div class="doc' + (own ? ' mine' : '') + '"><span class="ic">' + (ICON[ext] || '📄') + '</span><div class="doc-main"><b>' + safe(d.title) + '</b> '
      + (own ? '<span class="d-pill wait">Pour vous</span>' : '')
      + '<div class="d-sub">' + new Date(d.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' + safe(d.file_name) + '</div>'
      + (d.description ? '<p>' + safe(d.description) + '</p>' : '') + '</div>'
      + '<button class="d-btn sm" type="button" onclick="downloadFile(' + i + ')">⬇ Télécharger</button></div>';
  }).join('') || '<div class="d-empty"><span class="big">📚</span><p>Aucun document pour le moment.</p></div>';
}
async function downloadFile(i) {
  const d = docs[i], r = await db.storage.from('documents').download(d.storage_path);
  if (r.error) { alert('Téléchargement impossible : ' + r.error.message); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(r.data); a.download = d.file_name; a.click();
}
load();
</script><script src="app.js"></script></body></html>
