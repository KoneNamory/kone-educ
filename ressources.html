<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ressources | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9ff;font:16px Arial;color:#102149}main{max-width:900px;margin:auto;padding:32px 22px}.card{background:#fff;margin:16px 0;padding:20px;border-radius:15px}.doc{display:flex;justify-content:space-between;gap:16px;padding:17px 0;border-top:1px solid #e1eafa}.doc:first-child{border:0}.btn{padding:10px 13px;border:0;border-radius:8px;background:#1559eb;color:#fff;font-weight:bold;cursor:pointer}a{color:#1559eb;font-weight:bold;text-decoration:none}small{color:#64749a}</style></head><body><main><a href="index.html">← Accueil</a><h1>Ressources pédagogiques</h1><p id="message">Chargement…</p><section class="card"><div id="list"></div></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let docs=[];async function load(){const{data:{user}}=await db.auth.getUser();if(!user){message.textContent='Connectez-vous pour consulter les ressources.';return}const r=await db.from('documents').select('*').order('created_at',{ascending:false});if(r.error){message.textContent='Aucun document disponible.';return}docs=r.data;message.textContent=docs.length+' document(s) disponible(s).';list.innerHTML=docs.map((d,i)=>'<div class="doc"><div><b>'+safe(d.title)+'</b><br><small>'+safe(d.description||d.file_name)+'</small></div><button class="btn" onclick="downloadFile('+i+')">Télécharger</button></div>').join('')||'Aucun document disponible.'}async function downloadFile(i){const d=docs[i],r=await db.storage.from('documents').download(d.storage_path);if(r.error){alert(r.error.message);return}const a=document.createElement('a');a.href=URL.createObjectURL(r.data);a.download=d.file_name;a.click()}load()</script></body></html>
