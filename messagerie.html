<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messagerie | KONE.EDUC</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1559eb;--ink:#102149;--paper:#f5f9ff;--line:#dbe5f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px Arial;color:var(--ink)}main{max-width:800px;margin:auto;padding:30px}a{color:var(--blue);font-weight:bold;text-decoration:none}small{color:#60709a}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}#thread{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow-y:auto;padding:4px}.bubble{max-width:80%;padding:11px 14px;border-radius:14px;background:#eef4ff;white-space:pre-wrap;word-wrap:break-word}.bubble.me{align-self:flex-end;color:#fff;background:var(--blue)}.bubble.me small{color:#dce7ff}form{display:flex;gap:10px;margin-top:15px}textarea{flex:1;min-height:52px;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;resize:vertical}button{padding:12px 16px;border:0;border-radius:8px;color:#fff;background:var(--blue);font-weight:bold;cursor:pointer}button:disabled{opacity:.6}@media(max-width:520px){main{padding:20px 16px}form{flex-direction:column}.bubble{max-width:92%}}
</style></head><body><main><a id="back" href="index.html">← Retour</a><h1>Messagerie</h1><p id="message">Chargement de la conversation...</p><section class="card" id="box" hidden><h2 id="course"></h2><div id="thread" aria-live="polite"></div><form id="form"><textarea id="body" maxlength="2000" placeholder="Écrivez votre message..." required></textarea><button id="send">Envoyer</button></form></section></main>
<script>
const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),courseId=Number(new URLSearchParams(location.search).get('cours'));let user,course,otherLabel;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
async function init(){const x=await db.auth.getUser();user=x.data.user;if(!user){message.innerHTML='<a href="connexion.html">Connectez-vous</a> pour accéder à vos messages.';return}if(!courseId){message.textContent='Aucun cours sélectionné.';return}const r=await db.from('course_requests').select('*').eq('id',courseId).single();if(r.error){message.textContent='Ce cours est introuvable ou ne vous concerne pas.';return}course=r.data;const isParent=course.parent_id===user.id;back.href=isParent?'espace-parent.html':'espace-enseignant.html';back.textContent=isParent?'← Mon espace Parent':'← Mon espace Enseignant';if(!course.teacher_id){message.textContent='La messagerie sera disponible dès qu\'un enseignant sera attribué à ce cours.';return}otherLabel=isParent?'Enseignant':'Parent';document.getElementById('course').textContent=course.subject+' · '+course.student_name;message.textContent='Échangez ici avec '+(isParent?'l\'enseignant':'le parent')+' de ce cours.';box.hidden=false;await loadMessages();setInterval(loadMessages,15000)}
async function loadMessages(){const r=await db.from('messages').select('*').eq('course_request_id',courseId).order('created_at',{ascending:true});if(r.error){thread.textContent='Impossible de charger les messages : '+r.error.message;return}const atBottom=thread.scrollHeight-thread.scrollTop-thread.clientHeight<40;thread.innerHTML=r.data.map(m=>{const me=m.sender_id===user.id;return'<div class="bubble'+(me?' me':'')+'">'+safe(m.body)+'<br><small>'+(me?'Vous':otherLabel)+' · '+when(m.created_at)+'</small></div>'}).join('')||'<small>Aucun message pour le moment. Commencez la conversation.</small>';if(atBottom)thread.scrollTop=thread.scrollHeight}
form.onsubmit=async e=>{e.preventDefault();const text=body.value.trim();if(!text)return;send.disabled=true;const recipient=course.parent_id===user.id?course.teacher_id:course.parent_id;const r=await db.from('messages').insert({course_request_id:courseId,sender_id:user.id,recipient_id:recipient,body:text});send.disabled=false;if(r.error){message.textContent='Message non envoyé : '+r.error.message;return}body.value='';await loadMessages();thread.scrollTop=thread.scrollHeight};
init();
</script></body></html>
