# Garde le projet Supabase gratuit actif : sans activité pendant 7 jours, il se met en pause.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Interroger la base Supabase
        run: |
          URL=$(grep -o "url: '[^']*'" supabase-config.js | cut -d"'" -f2)
          KEY=$(grep -o "publishableKey: '[^']*'" supabase-config.js | cut -d"'" -f2)
          # La clé publique s'envoie dans l'en-tête apikey. La requête suffit à garder la base active :
          # un refus « permission denied » (code 42501) prouve que la base a bien répondu.
          STATUS=$(curl -s -o response.txt -w '%{http_code}' "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY")
          echo "Réponse Supabase : $STATUS"
          cat response.txt; echo
          if [ "$STATUS" = "200" ] || grep -q '"code":"42501"' response.txt; then echo "Base active."; else exit 1; fi
      - name: Vérifier que les tables existent
        run: |
          URL=$(grep -o "url: '[^']*'" supabase-config.js | cut -d"'" -f2)
          KEY=$(grep -o "publishableKey: '[^']*'" supabase-config.js | cut -d"'" -f2)
          MISSING=0
          for T in profiles course_requests teacher_profiles notifications documents messages contact_messages invoices session_reports reviews course_applications; do
            BODY=$(curl -s "$URL/rest/v1/$T?select=id&limit=0" -H "apikey: $KEY")
            if echo "$BODY" | grep -q 'PGRST205\|does not exist'; then echo "❌ $T : table absente"; MISSING=1; else echo "✅ $T"; fi
          done
          if [ "$MISSING" = "1" ]; then echo "::warning::Des tables manquent : relancer supabase-schema.sql dans Supabase (SQL Editor)."; fi
          # Colonnes ajoutées après coup : une erreur 42703 signifie que la colonne manque.
          for TC in teacher_profiles.levels teacher_profiles.location teacher_profiles.photo_url teacher_profiles.id_doc_path teacher_profiles.diploma_path teacher_profiles.cv_path course_requests.monthly_fee invoices.due_date; do
            BODY=$(curl -s "$URL/rest/v1/${TC%%.*}?select=${TC#*.}&limit=0" -H "apikey: $KEY")
            if echo "$BODY" | grep -q '42703'; then echo "❌ colonne $TC absente"; echo "::warning::Colonne $TC absente : relancer supabase-schema.sql."; else echo "✅ colonne $TC"; fi
          done
          # Fonction des profils publics et espaces de stockage
          RPC=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/public_teachers" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          if [ "$RPC" = "200" ]; then echo "✅ fonction public_teachers"; else echo "❌ fonction public_teachers (HTTP $RPC)"; echo "::warning::Fonction public_teachers absente : relancer supabase-schema.sql."; fi
          # Inscription directe : un appel volontairement invalide répond « Adresse e-mail invalide » si la fonction existe
          BODY=$(curl -s -X POST "$URL/rest/v1/rpc/create_account" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_email":"verification","p_password":"","p_full_name":"","p_phone":"","p_role":""}')
          if echo "$BODY" | grep -q 'Adresse e-mail invalide'; then echo "✅ fonction create_account (inscription directe)"; else echo "❌ fonction create_account : $BODY"; echo "::warning::Fonction create_account absente : relancer supabase-schema.sql."; fi
          # Service de connexion (Auth) : doit répondre 200
          AUTH=$(curl -s -o /dev/null -w '%{http_code}' "$URL/auth/v1/health" -H "apikey: $KEY")
          if [ "$AUTH" = "200" ]; then echo "✅ service de connexion (Auth)"; else echo "❌ service de connexion (HTTP $AUTH)"; echo "::warning::Service de connexion Supabase indisponible (HTTP $AUTH)."; fi
          # Fonctions réservées : présentes si elles répondent autre chose que « introuvable » (PGRST202 / 404)
          for FN in admin_users generate_month_invoices admin_set_profile teacher_offers; do
            CODE=$(curl -s -o /tmp/fn.json -w '%{http_code}' -X POST "$URL/rest/v1/rpc/$FN" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            if [ "$CODE" = "404" ] || grep -q 'PGRST202' /tmp/fn.json; then echo "❌ fonction $FN absente"; echo "::warning::Fonction $FN absente : relancer supabase-schema.sql."; else echo "✅ fonction $FN (HTTP $CODE)"; fi
          done
          # Seul l'espace public peut être vérifié sans connexion (un espace privé répond toujours « Bucket not found »)
          for BK in avatars; do
            BODY=$(curl -s "$URL/storage/v1/object/public/$BK/verification-inexistante.txt")
            if echo "$BODY" | grep -qi 'bucket not found'; then echo "❌ espace de stockage $BK absent"; echo "::warning::Espace de stockage $BK absent : relancer supabase-schema.sql."; else echo "✅ espace de stockage $BK"; fi
          done
      - name: Vérifier le sitemap et robots.txt en ligne
        run: |
          for U in sitemap.xml robots.txt; do
            echo "== https://kone-educ.vercel.app/$U"
            curl -s -o /dev/null -w 'HTTP %{http_code} · %{content_type}\n' -A 'Mozilla/5.0 (compatible; Googlebot/2.1)' "https://kone-educ.vercel.app/$U"
          done
          curl -s https://kone-educ.vercel.app/sitemap.xml | head -5
          curl -s https://kone-educ.vercel.app/ | grep -o 'google-site-verification[^>]*' || echo "balise Google absente"
