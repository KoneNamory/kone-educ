# Garde le projet Supabase gratuit actif : sans activité pendant 7 jours, il se met en pause.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger la base Supabase
        run: |
          URL=$(grep -o "url: '[^']*'" supabase-config.js | cut -d"'" -f2)
          KEY=$(grep -o "publishableKey: '[^']*'" supabase-config.js | cut -d"'" -f2)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Réponse Supabase : $STATUS"
          test "$STATUS" = "200"
