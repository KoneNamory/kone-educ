<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--b:#1559eb;--o:#fa7518;--n:#102149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#eef5ff,#fff8ef);font-family:'DM Sans',sans-serif;color:var(--n)}.box{width:min(100%,490px);padding:38px;border-radius:22px;background:#fff;box-shadow:0 22px 60px #ccd9ee}.brand{font:800 28px Manrope,sans-serif;color:var(--b);text-decoration:none}.brand b{color:var(--o)}h1{margin:25px 0 8px;font:800 30px Manrope,sans-serif}p{color:#56627d}label{display:block;margin-top:14px;font-weight:700}input,select{width:100%;margin-top:6px;padding:12px;border:1px solid #d7e1f2;border-radius:10px;font:inherit}button{width:100%;margin-top:23px;padding:14px;border:0;border-radius:10px;color:#fff;background:var(--b);font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:24px;color:#176b37;font-size:14px}.foot{text-align:center;font-size:14px}.foot a{color:var(--b);font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="index.html">KONE.<b>EDUC</b></a><h1>Créer votre compte</h1><p>Rejoignez KONE.EDUC en quelques instants.</p><form id="form"><label>Nom complet<input id="fullName" required autocomplete="name"></label><label>Téléphone<input id="phone" type="tel" required autocomplete="tel" placeholder="Ex. 0700000000"></label><label>Je suis<select id="role" required><option value="parent">Parent / tuteur</option><option value="teacher">Enseignant</option></select></label><label>Adresse e-mail<input id="email" type="email" required autocomplete="email"></label><label>Mot de passe<input id="password" type="password" required minlength="6" autocomplete="new-password"></label><button>Créer mon compte</button></form><p id="msg" class="msg" role="status"></p><p class="foot">Déjà inscrit ? <a href="connexion.html">Se connecter</a></p></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const profile={fullName:fullName.value.trim(),phone:phone.value.trim(),role:role.value};localStorage.setItem('koneEducPendingProfile',JSON.stringify(profile));const r=await db.auth.signUp({email:email.value,password:password.value});if(r.error){msg.style.color='#b42318';msg.textContent=r.error.message;return}if(r.data.session){const p=await db.from('profiles').insert({id:r.data.user.id,full_name:profile.fullName,phone:profile.phone,role:profile.role});if(p.error){msg.style.color='#b42318';msg.textContent=p.error.message;return}localStorage.removeItem('koneEducPendingProfile');location.href=profile.role==='teacher'?'espace-enseignant.html':'espace-parent.html';return}msg.textContent='Compte créé. Consultez votre e-mail, confirmez-le puis connectez-vous.'}</script></body></html>
