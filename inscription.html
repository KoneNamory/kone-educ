<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte | KONE.EDUC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KONE.EDUC"><link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48"><meta name="theme-color" content="#1559eb"><meta name="robots" content="noindex"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--b:#1559eb;--o:#fa7518;--n:#102149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#eef5ff,#fff8ef);font-family:'DM Sans',sans-serif;color:var(--n)}.box{width:min(100%,490px);padding:38px;border-radius:22px;background:#fff;box-shadow:0 22px 60px #ccd9ee}.brand{font:800 28px Manrope,sans-serif;color:var(--b);text-decoration:none}.brand b{color:var(--o)}h1{margin:25px 0 8px;font:800 30px Manrope,sans-serif}p{color:#56627d}label{display:block;margin-top:14px;font-weight:700}input,select{width:100%;margin-top:6px;padding:12px;border:1px solid #d7e1f2;border-radius:10px;font:inherit}button{width:100%;margin-top:23px;padding:14px;border:0;border-radius:10px;color:#fff;background:var(--b);font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:24px;color:#176b37;font-size:14px}.foot{text-align:center;font-size:14px}.foot a{color:var(--b);font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="index.html" style="display:inline-flex;align-items:center;gap:9px"><img src="assets/logo/kone-educ-embleme.jpg" alt="" width="42" height="42"><span>KONE.<b>EDUC</b></span></a><h1>Créer votre compte</h1><p>Rejoignez KONE.EDUC en quelques instants.</p><form id="form"><label>Nom complet<input id="fullName" required autocomplete="name"></label><label>Téléphone<input id="phone" type="tel" required autocomplete="tel" placeholder="Ex. 0700000000"></label><label>Je suis<select id="role" required><option value="parent">Parent / tuteur</option><option value="teacher">Enseignant</option></select></label><label>Adresse e-mail<input id="email" type="email" required autocomplete="email"></label><label>Mot de passe<input id="password" type="password" required minlength="6" autocomplete="new-password"></label><p style="font-size:13px;margin:14px 0 0">En créant un compte, vous acceptez notre <a href="mentions-legales.html#confidentialite">politique de confidentialité</a>.</p><button>Créer mon compte</button></form><p id="msg" class="msg" role="status"></p><p class="foot">Déjà inscrit ? <a href="connexion.html">Se connecter</a></p></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);if(new URLSearchParams(location.search).get('role')==='teacher')role.value='teacher';const go=()=>location.href=role.value==='teacher'?(new URLSearchParams(location.search).get('role')==='teacher'?'candidature-enseignant.html':'espace-enseignant.html'):'espace-parent.html',fail=t=>{msg.style.color='#b42318';msg.textContent=t;btn.disabled=false};const btn=form.querySelector('button');form.onsubmit=async e=>{e.preventDefault();msg.textContent='';msg.style.color='';btn.disabled=true;const profile={fullName:fullName.value.trim(),phone:phone.value.trim(),role:role.value},mail=email.value.trim().toLowerCase();
// Création directe du compte, sans e-mail de confirmation
const c=await db.rpc('create_account',{p_email:mail,p_password:password.value,p_full_name:profile.fullName,p_phone:profile.phone,p_role:profile.role});if(!c.error){const s=await db.auth.signInWithPassword({email:mail,password:password.value});if(s.error)return fail('Compte créé. Connectez-vous avec votre e-mail et votre mot de passe.');return go()}if(!/create_account|PGRST202|schema cache/.test(c.error.code+' '+c.error.message))return fail(c.error.message);
// Ancienne méthode, tant que la fonction n’est pas installée dans Supabase
localStorage.setItem('koneEducPendingProfile',JSON.stringify(profile));const r=await db.auth.signUp({email:mail,password:password.value});if(r.error)return fail(r.error.message);if(r.data.session){const p=await db.from('profiles').insert({id:r.data.user.id,full_name:profile.fullName,phone:profile.phone,role:profile.role});if(p.error)return fail(p.error.message);localStorage.removeItem('koneEducPendingProfile');return go()}btn.disabled=false;msg.textContent='Compte créé. Consultez votre e-mail, confirmez-le puis connectez-vous.'}</script></body></html>
