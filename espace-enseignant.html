<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Enseignant | KONE.EDUC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KONE.EDUC"><meta name="theme-color" content="#1559eb"><link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="dash.css"></head><body><main>
<section class="d-hero"><div><p class="eyebrow">Espace enseignant</p><h1 id="hello">Bonjour 👋</h1><p id="message">Chargement de votre profil…</p></div><div class="d-hero-cta" id="heroCta"></div></section>
<div class="d-kpis" id="kpis"></div>
<div class="d-grid">
<div class="d-col">
<section class="card d-card"><div class="d-head"><h2>Mon dossier</h2><span id="statusPill"></span></div><div id="profile"></div></section>
<section class="card d-card"><div class="d-head"><h2>Mes cours</h2><span class="d-count" id="coursesCount">0</span></div><div id="courses">Chargement…</div></section>
</div>
<aside class="d-col">
<section class="card d-card"><div class="d-head"><h2>Notifications</h2></div><div id="notifications">Chargement…</div></section>
<section class="card d-card" id="availabilityCard" hidden><div class="d-head"><h2>Mes disponibilités</h2></div><form id="form"><label>Créneaux habituels<input id="availability" required placeholder="Ex. Mercredi après-midi, samedi matin"></label><label>Format de cours<select id="format"><option>À domicile</option><option>En ligne</option><option>À domicile et en ligne</option></select></label><button class="d-btn">Enregistrer</button><p class="d-flash" id="flash" role="status"></p></form></section>
<section class="card d-card d-help"><h2>Besoin d’aide ?</h2><p>Notre équipe vous accompagne pour votre dossier et vos cours, du lundi au samedi.</p><a class="d-btn orange sm" href="https://wa.me/2250161701361">💬 Écrire sur WhatsApp</a></section>
</aside>
</div>
</main>
<script src="dossier.js"></script><script>
const db = supabase.createClient(KONE_EDUC_SUPABASE.url, KONE_EDUC_SUPABASE.publishableKey);
let user;
const safe = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = d => new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const kpi = (ic, value, label) => '<div class="d-kpi"><div class="ic">' + ic + '</div><b>' + value + '</b><span>' + label + '</span></div>';
const DOCS = KE_DOSSIER.docs;

function steps(current) {
  return '<div class="d-steps">' + [['Dossier', 'Informations et documents'], ['Validation', 'Étude par KONE.EDUC'], ['Cours', 'Familles proposées']]
    .map((x, i) => '<div class="d-step ' + (i < current ? 'done' : i === current ? 'now' : '') + '"><b>' + x[0] + '</b>' + x[1] + '</div>').join('') + '</div>';
}

async function load() {
  user = (await db.auth.getUser()).data.user;
  if (!user) { message.innerHTML = '<a href="connexion.html" style="color:#fff">Connectez-vous</a> avec votre compte Enseignant.'; return; }
  const [me, r, requests, n, reports] = await Promise.all([
    db.from('profiles').select('full_name').eq('id', user.id).maybeSingle(),
    db.from('teacher_profiles').select('*').eq('id', user.id).maybeSingle(),
    db.from('course_requests').select('*').eq('teacher_id', user.id).order('created_at', { ascending: false }),
    db.from('notifications').select('*').eq('recipient_id', user.id).order('created_at', { ascending: false }),
    db.from('session_reports').select('id').eq('teacher_id', user.id)
  ]);
  const name = (me.data && me.data.full_name || '').trim();
  hello.textContent = 'Bonjour' + (name ? ' ' + name.split(/\s+/)[0] : '') + ' 👋';
  if (r.error) { message.textContent = 'Erreur : ' + r.error.message; return; }
  const t = r.data;
  const unread = n.error ? 0 : n.data.filter(x => !x.is_read).length;
  const active = requests.error ? [] : requests.data.filter(c => c.status === 'assigned');
  const pct = t ? KE_DOSSIER.percent(t) : 0;
  const missing = t ? KE_DOSSIER.missing(t).map(d => d[1].toLowerCase()) : [];
  const infoOk = t && !KE_DOSSIER.fields.some(d => !String(t[d[0]] || '').trim());

  // En-tête et indicateurs
  if (!t) message.textContent = 'Bienvenue ! Complétez votre dossier pour postuler et recevoir des cours.';
  else if (!t.approved) message.textContent = missing.length ? 'Votre dossier est presque prêt : complétez les éléments manquants pour qu’il soit étudié.' : 'Votre dossier est en cours d’étude par notre équipe. Nous vous contactons très vite.';
  else message.textContent = active.length ? 'Vous suivez ' + active.length + ' élève(s). Pensez au compte rendu après chaque séance.' : 'Votre profil est validé. Consultez les offres de cours et postulez à celles qui vous correspondent.';
  heroCta.innerHTML = !t || missing.length ? '<a class="d-btn light" href="candidature-enseignant.html#teacher-form">Compléter mon dossier →</a>' : (t.approved ? '<a class="d-btn light" href="offres.html">📢 Voir les offres de cours</a>' : '<a class="d-btn light" href="enseignants.html">Voir mon profil public</a>');
  kpis.innerHTML = kpi('📁', pct + ' %', 'Dossier complété') + kpi('🎓', active.length, 'Élève(s) suivi(s)') + kpi('📝', reports.error ? 0 : reports.data.length, 'Compte(s) rendu(s)') + kpi('🔔', unread, 'Notification(s) non lue(s)');
  statusPill.innerHTML = !t ? '<span class="d-pill off">À compléter</span>' : t.approved ? '<span class="d-pill ok">✓ Profil validé</span>' : '<span class="d-pill wait">En attente de validation</span>';

  // Dossier
  if (!t) {
    availabilityCard.hidden = true;
    profile.innerHTML = steps(0) + '<p class="d-sub">Pour postuler, renseignez votre diplôme, votre matière, vos disponibilités et votre zone, puis ajoutez vos documents (JPG, PNG ou PDF, 5 Mo maximum).</p>'
      + '<div class="d-checks">' + DOCS.map(d => '<div class="d-check"><i>○</i>' + d[1] + '</div>').join('') + '</div>'
      + '<a class="d-btn" href="candidature-enseignant.html">Compléter mon dossier</a>';
  } else {
    availabilityCard.hidden = false;
    const photo = t.photo_url ? '<img class="d-av round" src="' + safe(t.photo_url) + '" alt="">' : '<span class="d-av round">' + safe((name || '?').charAt(0).toUpperCase()) + '</span>';
    profile.innerHTML = steps(t.approved ? 3 : missing.length ? 0 : 1)
      + '<div class="d-profile">' + photo + '<div><h3>' + safe(name || 'Mon profil') + '</h3><p class="d-sub">' + safe(t.subject) + ' · ' + safe(t.degree) + '</p>'
      + '<div class="d-meta">' + [t.levels, t.location, t.format, t.experience].filter(Boolean).map(x => '<span>' + safe(x) + '</span>').join('') + '</div></div></div>'
      + '<div class="d-progress" aria-label="Dossier complété à ' + pct + ' %"><i style="width:' + pct + '%"></i></div><p class="d-sub">' + (missing.length ? '⚠ Dossier incomplet : ' + safe(missing.join(', ')) + '.' : '✓ Dossier complet') + '</p>'
      + '<div class="d-checks"><div class="d-check' + (infoOk ? ' done' : '') + '"><i>' + (infoOk ? '✓' : '○') + '</i>Informations du profil</div>' + DOCS.map(d => '<div class="d-check' + (t[d[0]] ? ' done' : '') + '"><i>' + (t[d[0]] ? '✓' : '○') + '</i>' + d[1] + '</div>').join('') + '</div>'
      + '<a class="d-btn ' + (missing.length ? '' : 'ghost') + '" href="candidature-enseignant.html">' + (missing.length ? 'Compléter mon dossier' : 'Mettre à jour mon dossier') + '</a>';
    availability.value = t.availability || '';
    format.value = t.format || 'À domicile';
  }

  // Cours
  const list = requests.error ? [] : requests.data;
  coursesCount.textContent = list.length;
  courses.innerHTML = requests.error ? 'Impossible de charger les cours.' : list.map(c => {
    const pill = c.status === 'completed' ? '<span class="d-pill off">Terminé</span>' : c.status === 'cancelled' ? '<span class="d-pill bad">Annulé</span>' : '<span class="d-pill ok">En cours</span>';
    return '<div class="d-item row"><span class="d-av">' + safe(String(c.subject || '?').charAt(0)) + '</span><div class="d-item-main"><div class="d-item-top"><div><b>' + safe(c.student_name) + ' · ' + safe(c.subject) + '</b><p class="d-sub">' + safe(c.availability) + '</p></div>' + pill + '</div>'
      + '<div class="d-meta"><span>' + safe(c.school_level) + '</span><span>📍 ' + safe(c.location) + '</span><span>' + safe(c.format) + '</span></div>'
      + (c.status === 'cancelled' ? '' : '<div class="d-actions"><a class="d-link" href="suivi.html?cours=' + c.id + '">📝 Compte rendu de séance</a><a class="d-link" href="messagerie.html?cours=' + c.id + '">💬 Écrire au parent</a></div>') + '</div></div>';
  }).join('') || '<div class="d-empty"><span class="big">📚</span>' + (t && t.approved ? '<p>Aucun cours pour le moment. Postulez aux offres de cours pour être choisi par l’équipe.</p><a class="d-btn" href="offres.html">Voir les offres de cours</a>' : '<p>Les cours vous seront proposés une fois votre dossier validé.</p>') + '</div>';

  // Notifications
  notifications.innerHTML = n.error ? 'Les notifications seront disponibles prochainement.' : n.data.slice(0, 8).map(x => '<div class="d-note' + (x.is_read ? ' read' : '') + '"><span class="dot"></span><b>' + safe(x.title) + '</b><small>' + safe(x.body) + ' · ' + day(x.created_at) + '</small></div>').join('') || '<p class="d-sub">Aucune notification pour le moment.</p>';
  if (unread) db.from('notifications').update({ is_read: true }).eq('recipient_id', user.id).eq('is_read', false).then(() => document.dispatchEvent(new Event('ke-notifications-read')));
}

form.onsubmit = async e => {
  e.preventDefault();
  const r = await db.from('teacher_profiles').update({ availability: availability.value, format: format.value }).eq('id', user.id);
  flash.style.color = r.error ? '#b42318' : '';
  flash.textContent = r.error ? 'Erreur : ' + r.error.message : '✓ Disponibilités enregistrées.';
};
load();
</script><script src="app.js"></script></body></html>
