<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Enseignant | KONE.EDUC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KONE.EDUC"><meta name="theme-color" content="#1559eb"><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9ff;font:16px Arial;color:#102149}main{max-width:900px;margin:auto;padding:30px}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.row{padding:14px 0;border-top:1px solid #dbe5f5}.row:first-child{border-top:0}.notice{border-left:4px solid #1559eb;background:#eef4ff;margin:12px 0;padding:12px 14px;border-radius:7px}label{display:block;margin-top:12px;font-weight:bold}input,select{width:100%;padding:10px;box-sizing:border-box;border:1px solid #dbe5f5;border-radius:7px}.btn{margin-top:17px;padding:11px;border:0;border-radius:7px;background:#1559eb;color:#fff;font-weight:bold}.tag{padding:5px 8px;border-radius:12px;background:#fff0dc;font-size:12px}a{color:#1559eb;font-weight:bold;text-decoration:none}small{color:#60709a}.notice.read{border-left-color:#c9d3e6;background:#f6f8fc}.new{display:inline-block;padding:2px 7px;border-radius:99px;background:#fa7518;color:#fff;font-size:11px;font-weight:bold}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body><main><button type="button" onclick="db.auth.signOut().then(()=>location.href='connexion.html')" style="float:right;padding:8px 12px;border:1px solid #dbe5f5;border-radius:8px;background:#fff;color:#102149;font:bold 14px Arial;cursor:pointer">Se déconnecter</button><a href="index.html">← Accueil</a><h1>Mon espace Enseignant</h1><p id="message">Chargement de votre profil...</p><section class="card"><h2>Mon profil</h2><p id="profile"></p></section><section class="card"><h2>Mes notifications</h2><div id="notifications">Chargement...</div></section><section class="card"><h2>Mes cours attribués</h2><div id="courses">Chargement...</div></section><section class="card"><h2>Mes disponibilités</h2><form id="form"><label>Créneaux habituels<input id="availability" required></label><label>Format de cours<select id="format"><option>À domicile</option><option>En ligne</option><option>À domicile et en ligne</option></select></label><button class="btn">Enregistrer</button></form></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);let user;const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const x=await db.auth.getUser();user=x.data.user;if(!user){message.textContent='Connectez-vous avec votre compte Enseignant.';return}const[r,requests,n]=await Promise.all([db.from('teacher_profiles').select('*').eq('id',user.id).single(),db.from('course_requests').select('*').eq('teacher_id',user.id).order('created_at',{ascending:false}),db.from('notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false})]);if(r.error){message.textContent='Erreur : '+r.error.message;return}message.textContent='Profil chargé.';profile.innerHTML='<b>'+safe(r.data.subject)+'</b> · '+safe(r.data.degree)+'<br><span class="tag">'+(r.data.approved?'Validé':'En attente de validation')+'</span>';availability.value=r.data.availability||'';format.value=r.data.format||'À domicile';courses.innerHTML=requests.error?'Impossible de charger les cours.':requests.data.map(c=>'<div class="row"><b>'+safe(c.student_name)+' · '+safe(c.subject)+'</b>'+(c.status==='completed'?' <span class="tag">Terminé</span>':c.status==='cancelled'?' <span class="tag">Annulé</span>':'')+'<br><small>'+safe(c.school_level)+' · '+safe(c.location)+' · '+safe(c.format)+'<br>'+safe(c.availability)+'</small>'+(c.status==='cancelled'?'':'<br><a href="suivi.html?cours='+c.id+'">📝 Compte rendu de séance</a> · <a href="messagerie.html?cours='+c.id+'">💬 Écrire au parent</a>')+'</div>').join('')||'Aucun cours ne vous est encore attribué.';notifications.innerHTML=n.error?'Les notifications seront disponibles après la configuration.':n.data.slice(0,10).map(x=>'<div class="notice'+(x.is_read?' read':'')+'">'+(x.is_read?'':'<span class="new">Nouveau</span> ')+'<b>'+safe(x.title)+'</b> <small>· '+new Date(x.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</small><br><small>'+safe(x.body)+'</small></div>').join('')||'Aucune notification pour le moment.';if(!n.error&&n.data.some(x=>!x.is_read))db.from('notifications').update({is_read:true}).eq('recipient_id',user.id).eq('is_read',false).then(()=>document.dispatchEvent(new Event('ke-notifications-read')))}form.onsubmit=async e=>{e.preventDefault();const r=await db.from('teacher_profiles').update({availability:availability.value,format:format.value}).eq('id',user.id);message.textContent=r.error?'Erreur : '+r.error.message:'Disponibilités mises à jour.'};load()</script><script src="app.js"></script></body></html>
