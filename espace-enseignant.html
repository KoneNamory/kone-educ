<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Enseignant | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9ff;font:16px Arial;color:#102149}main{max-width:900px;margin:auto;padding:30px}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.row{padding:14px 0;border-top:1px solid #dbe5f5}.row:first-child{border-top:0}label{display:block;margin-top:12px;font-weight:bold}input,select{width:100%;padding:10px;box-sizing:border-box;border:1px solid #dbe5f5;border-radius:7px}.btn{margin-top:17px;padding:11px;border:0;border-radius:7px;background:#1559eb;color:#fff;font-weight:bold}.tag{padding:5px 8px;border-radius:12px;background:#fff0dc;font-size:12px}a{color:#1559eb;font-weight:bold;text-decoration:none}small{color:#60709a}</style></head><body><main><a href="index.html">← Accueil</a><h1>Mon espace Enseignant</h1><p id="message">Chargement de votre profil...</p><section class="card"><h2>Mon profil</h2><p id="profile"></p></section><section class="card"><h2>Mes cours attribués</h2><div id="courses">Chargement...</div></section><section class="card"><h2>Mes disponibilités</h2><form id="form"><label>Créneaux habituels<input id="availability" required></label><label>Format de cours<select id="format"><option>À domicile</option><option>En ligne</option><option>À domicile et en ligne</option></select></label><button class="btn">Enregistrer</button></form></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);let user;const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const x=await db.auth.getUser();user=x.data.user;if(!user){message.textContent='Connectez-vous avec votre compte Enseignant.';return}const[r,requests]=await Promise.all([db.from('teacher_profiles').select('*').eq('id',user.id).single(),db.from('course_requests').select('*').eq('teacher_id',user.id).order('created_at',{ascending:false})]);if(r.error){message.textContent='Erreur : '+r.error.message;return}message.textContent='Profil chargé.';profile.innerHTML='<b>'+safe(r.data.subject)+'</b> · '+safe(r.data.degree)+'<br><span class="tag">'+(r.data.approved?'Validé':'En attente de validation')+'</span>';availability.value=r.data.availability||'';format.value=r.data.format||'À domicile';courses.innerHTML=requests.error?'Impossible de charger les cours.':requests.data.map(c=>'<div class="row"><b>'+safe(c.student_name)+' · '+safe(c.subject)+'</b><br><small>'+safe(c.school_level)+' · '+safe(c.location)+' · '+safe(c.format)+'<br>'+safe(c.availability)+'</small></div>').join('')||'Aucun cours ne vous est encore attribué.'}form.onsubmit=async e=>{e.preventDefault();const r=await db.from('teacher_profiles').update({availability:availability.value,format:format.value}).eq('id',user.id);message.textContent=r.error?'Erreur : '+r.error.message:'Disponibilités mises à jour.'};load()</script></body></html>
