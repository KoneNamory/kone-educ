<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion | KONE.EDUC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KONE.EDUC"><link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48"><meta name="theme-color" content="#1559eb"><meta name="robots" content="noindex"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--b:#1559eb;--o:#fa7518;--n:#102149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#eef5ff,#fff8ef);font-family:'DM Sans',sans-serif;color:var(--n)}.box{width:min(100%,455px);padding:38px;border-radius:22px;background:#fff;box-shadow:0 22px 60px #ccd9ee}.brand{font:800 28px Manrope,sans-serif;color:var(--b);text-decoration:none}.brand b{color:var(--o)}h1{margin:27px 0 8px;font:800 31px Manrope,sans-serif}p{color:#56627d;line-height:1.5}label{display:block;margin-top:17px;font-weight:700}input{width:100%;margin-top:7px;padding:13px;border:1px solid #d7e1f2;border-radius:10px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;color:#fff;background:var(--b);font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:24px;color:#b42318;font-size:14px}.foot{text-align:center;font-size:14px}.foot a{color:var(--b);font-weight:800;text-decoration:none}.pw{position:relative;display:block}.pw input{padding-right:48px}#togglePw{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;margin:0;padding:0;border:0;border-radius:8px;background:transparent;font-size:18px;cursor:pointer;box-shadow:none}</style></head><body><main class="box"><a class="brand" href="index.html" style="display:inline-flex;align-items:center;gap:9px"><img src="assets/logo/kone-educ-embleme.jpg" alt="" width="42" height="42"><span>KONE.<b>EDUC</b></span></a><h1>Bon retour</h1><p>Connectez-vous pour accéder à votre espace personnel.</p><form id="form"><label>Adresse e-mail<input id="email" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" required></label><label>Mot de passe<span class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="togglePw" aria-label="Afficher le mot de passe">👁</button></span></label><p style="margin:10px 0 0;text-align:right;font-size:14px"><a href="mot-de-passe-oublie.html" style="color:#1559eb;font-weight:700;text-decoration:none">Mot de passe oublié ?</a></p><button type="submit">Se connecter</button></form><p id="msg" class="msg" role="status"></p><p class="foot">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);togglePw.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';togglePw.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe')};// Message précis selon la cause réelle de l’échec (et pas toujours « mot de passe incorrect »)
function loginError(err){const c=(err.code||'')+' '+(err.message||'')+' '+(err.status||'');if(/invalid_credentials|Invalid login credentials/i.test(c))return'E-mail ou mot de passe incorrect. Vérifiez l’adresse (sans espace) et le mot de passe : affichez-le avec 👁 pour le relire.';if(/email_not_confirmed|not confirmed/i.test(c))return'Votre adresse e-mail n’est pas encore confirmée. Contactez-nous sur WhatsApp au 01 61 70 13 61 pour l’activer.';if(/rate|too many|429/i.test(c))return'Trop de tentatives de connexion. Patientez quelques minutes avant de réessayer.';if(/fetch|network|Failed|timeout|5\d\d/i.test(c))return'Connexion au serveur impossible pour le moment. Vérifiez votre connexion internet et réessayez dans un instant.';return'Connexion impossible : '+(err.message||'erreur inconnue')}form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const btn=form.querySelector('button:not(#togglePw)');btn.disabled=true;btn.textContent='Connexion…';let r;try{r=await db.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value})}catch(x){r={error:x}}btn.disabled=false;btn.textContent='Se connecter';if(r.error){msg.textContent=loginError(r.error);return}let p=await db.from('profiles').select('role').eq('id',r.data.user.id).single();if(p.error){const pending=JSON.parse(localStorage.getItem('koneEducPendingProfile')||'null');if(pending){const created=await db.from('profiles').insert({id:r.data.user.id,full_name:pending.fullName,phone:pending.phone,role:pending.role});if(created.error){msg.textContent='Erreur de création du profil : '+created.error.message;return}localStorage.removeItem('koneEducPendingProfile');p=await db.from('profiles').select('role').eq('id',r.data.user.id).single()}}const target=new URLSearchParams(location.search).get('redirect');if((target==='reservation.html'&&p.data?.role==='parent')||(target==='candidature-enseignant.html'&&p.data?.role==='teacher')){location.href=target;return}location.href=p.data?.role==='admin'?'espace-admin.html':p.data?.role==='teacher'?'espace-enseignant.html':'espace-parent.html'}</script></body></html>
