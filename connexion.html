<!doctype html><html lang="fr"><head><meta charset="utf-8"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Connexion KONE.EDUC</title></head><body><h1>KONE.EDUC</h1><h2 id="title">Connexion</h2><form id="form"><input id="email" type="email" placeholder="E-mail" required><br><input id="password" type="password" placeholder="Mot de passe" minlength="6" required><br><select id="role" hidden><option value="parent">Parent</option><option value="teacher">Enseignant</option></select><br><button id="go">Se connecter</button></form><p id="msg"></p><button id="toggle">Créer un compte</button><script>const client=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);let create=false;toggle.onclick=()=>{create=!create;title.textContent=create?'Créer un compte':'Connexion';go.textContent=create?'Créer':'Se connecter';role.hidden=!create;toggle.textContent=create?'J’ai déjà un compte':'Créer un compte'};form.onsubmit=async e=>{e.preventDefault();const mail=document.getElementById('email').value,pass=password.value;if(create){const r=await client.auth.signUp({email:mail,password:pass});msg.textContent=r.error?r.error.message:'Compte créé. Vérifiez votre e-mail.'}else{const r=await client.auth.signInWithPassword({email:mail,password:pass});if(r.error){msg.textContent=r.error.message;return}location.href='espace-parent.html'}};</script></body></html>
