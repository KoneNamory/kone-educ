<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--b:#1559eb;--o:#fa7518;--n:#102149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#eef5ff,#fff8ef);font-family:'DM Sans',sans-serif;color:var(--n)}.box{width:min(100%,455px);padding:38px;border-radius:22px;background:#fff;box-shadow:0 22px 60px #ccd9ee}.brand{font:800 28px Manrope,sans-serif;color:var(--b);text-decoration:none}.brand b{color:var(--o)}h1{margin:27px 0 8px;font:800 31px Manrope,sans-serif}p{color:#56627d;line-height:1.5}label{display:block;margin-top:17px;font-weight:700}input{width:100%;margin-top:7px;padding:13px;border:1px solid #d7e1f2;border-radius:10px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;color:#fff;background:var(--b);font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:24px;color:#b42318;font-size:14px}.foot{text-align:center;font-size:14px}.foot a{color:var(--b);font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="index.html">KONE.<b>EDUC</b></a><h1>Bon retour</h1><p>Connectez-vous pour accéder à votre espace personnel.</p><form id="form"><label>Adresse e-mail<input id="email" type="email" autocomplete="email" required></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button></form><p id="msg" class="msg" role="status"></p><p class="foot">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const r=await db.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){msg.textContent='E-mail ou mot de passe incorrect.';return}let p=await db.from('profiles').select('role').eq('id',r.data.user.id).single();if(p.error){const pending=JSON.parse(localStorage.getItem('koneEducPendingProfile')||'null');if(pending){const created=await db.from('profiles').insert({id:r.data.user.id,full_name:pending.fullName,phone:pending.phone,role:pending.role});if(created.error){msg.textContent='Erreur de création du profil : '+created.error.message;return}localStorage.removeItem('koneEducPendingProfile');p=await db.from('profiles').select('role').eq('id',r.data.user.id).single()}}const target=new URLSearchParams(location.search).get('redirect');if(target==='reservation.html'&&p.data?.role==='parent'){location.href=target;return}location.href=p.data?.role==='admin'?'espace-admin.html':p.data?.role==='teacher'?'espace-enseignant.html':'espace-parent.html'}</script></body></html>
