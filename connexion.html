<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><h1>KONE.EDUC</h1><h2>Connexion</h2><form id="form"><input id="email" type="email" placeholder="E-mail" required><br><input id="password" type="password" placeholder="Mot de passe" required><br><button>Se connecter</button></form><p id="msg"></p><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);form.onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){msg.textContent=r.error.message;return}const p=await db.from('profiles').select('role').eq('id',r.data.user.id).single();const role=p.data?.role;location.href=role==='admin'?'espace-admin.html':role==='teacher'?'espace-enseignant.html':'espace-parent.html'}</script></body></html>
