<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion | KONE.EDUC</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:linear-gradient(135deg,#eef5ff,#fff5e9);font:15px Arial;color:#101a35}.card{width:min(430px,calc(100% - 40px));padding:32px;border-radius:18px;background:#fff;box-shadow:0 18px 45px #d6e2f5}.brand{font-size:26px;font-weight:bold;color:#1559eb}.brand b{color:#fa7518}h1{margin:24px 0 8px}p{color:#596580;line-height:1.5}label{display:block;margin-top:18px;font-weight:bold}input,select{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #dbe5f5;border-radius:8px}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:8px;color:#fff;background:#1559eb;font-weight:bold;cursor:pointer}a{display:block;margin-top:18px;text-align:center;color:#1559eb;font-weight:bold;text-decoration:none}</style></head><body><main class="card"><div class="brand">KONE.<b>EDUC</b></div><h1>Bienvenue</h1><p>Connectez-vous à votre espace. Cette version est une démonstration locale.</p><form id="login"><label>Adresse e-mail<input type="email" required placeholder="vous@exemple.com"></label><label>Votre rôle<select id="role"><option value="espace-parent.html">Parent</option><option value="espace-enseignant.html">Enseignant</option><option value="espace-admin.html">Administrateur</option></select></label><button>Accéder à mon espace</button></form><a href="index.html">← Retour à l’accueil</a></main><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();location.href=document.getElementById('role').value})</script></body></html>
