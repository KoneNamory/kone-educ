<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facture | KONE.EDUC</title><meta name="robots" content="noindex"><meta name="theme-color" content="#1559eb">
<link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48">
<script src="supabase-config.js"></script><script src="payment-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1559eb;--o:#fa7518;--ink:#0f1b37;--mut:#5b6884;--line:#e3ebf8}
*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:var(--ink);font:15px/1.5 "DM Sans",Arial,sans-serif}
.bar{max-width:820px;margin:20px auto 0;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar a{color:var(--b);font-weight:700;text-decoration:none}
.bar button{padding:11px 16px;border:0;border-radius:10px;background:var(--b);color:#fff;font:800 14px "DM Sans",Arial,sans-serif;cursor:pointer}
.sheet{max-width:820px;margin:14px auto 40px;padding:44px 48px;background:#fff;border-radius:16px;box-shadow:0 18px 48px rgba(21,61,140,.12)}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:22px;border-bottom:3px solid var(--b)}
.brand{display:flex;gap:12px;align-items:center}.brand img{width:64px;height:64px;object-fit:contain}
.brand b{display:block;font:800 26px Manrope,sans-serif;letter-spacing:-1px;color:var(--b)}.brand b span{color:var(--o)}
.brand small,.org small{display:block;color:var(--mut);font-size:12.5px;line-height:1.45}
.doc{text-align:right}.doc h1{margin:0;font:800 30px Manrope,sans-serif;letter-spacing:-1px}.doc .no{font-weight:800;color:var(--b)}
.doc small{display:block;color:var(--mut)}
.stamp{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:99px;font-weight:800;font-size:13px}
.stamp.paid{background:#e5f7ec;color:#11743a;border:2px solid #11743a}.stamp.unpaid{background:#fff1dc;color:#9a5a00}.stamp.pending{background:#eaf1ff;color:#1559eb}.stamp.late{background:#fdecea;color:#b42318}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
.parties h2{margin:0 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.parties p{margin:0}
table{width:100%;border-collapse:collapse;margin:8px 0 0}
th{padding:10px 12px;background:#f4f7fc;text-align:left;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}td small{color:var(--mut)}
.num{text-align:right;white-space:nowrap}
.total{display:flex;justify-content:flex-end;margin-top:14px}.total div{min-width:280px;padding:14px 18px;border-radius:12px;background:#0f1b37;color:#fff;display:flex;justify-content:space-between;gap:20px;font-size:18px;font-weight:800}
.pay{margin-top:26px;padding:16px 18px;border-radius:12px;background:#f4f8ff}.pay h2{margin:0 0 8px;font-size:15px}.pay ul{margin:0;padding-left:18px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;text-align:center}
#msg{max-width:820px;margin:40px auto;padding:0 16px;text-align:center}
@media(max-width:640px){.sheet{padding:26px 18px;border-radius:0}.top{flex-direction:column}.doc{text-align:left}.parties{grid-template-columns:1fr}.total div{min-width:0;width:100%}}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;max-width:none;box-shadow:none;border-radius:0;padding:10mm 8mm}@page{size:A4;margin:10mm}}
</style></head><body>
<div class="bar"><a id="back" href="paiements.html">← Retour</a><button type="button" onclick="window.print()">🖨 Imprimer / Télécharger en PDF</button></div>
<p id="msg">Chargement de la facture…</p>
<main class="sheet" id="sheet" hidden></main>
<script>
const db = supabase.createClient(KONE_EDUC_SUPABASE.url, KONE_EDUC_SUPABASE.publishableKey);
const safe = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fcfa = n => Number(n).toLocaleString('fr-FR') + ' FCFA';
const dateFr = d => new Date(d.length > 10 ? d : d + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const monthFr = m => new Date(m.slice(0, 7) + '-01T00:00:00').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const METHOD = { wave: 'Wave', orange_money: 'Orange Money', moov_money: 'Moov Money', mtn_money: 'MTN MoMo' };

(async function () {
  const id = Number(new URLSearchParams(location.search).get('id'));
  const { data: { user } } = await db.auth.getUser();
  if (!user) { msg.innerHTML = '<a href="connexion.html">Connectez-vous</a> pour voir votre facture.'; return; }
  const me = (await db.from('profiles').select('role').eq('id', user.id).maybeSingle()).data;
  if (me && me.role === 'admin') back.href = 'espace-admin.html#billing';
  const inv = await db.from('invoices').select('*').eq('id', id).maybeSingle();
  if (inv.error || !inv.data) { msg.textContent = 'Facture introuvable ou non accessible avec ce compte.'; return; }
  const i = inv.data;
  const [course, parent, reports] = await Promise.all([
    db.from('course_requests').select('*').eq('id', i.course_request_id).maybeSingle(),
    db.from('profiles').select('full_name, phone').eq('id', i.parent_id).maybeSingle(),
    db.from('session_reports').select('id, session_date').eq('course_request_id', i.course_request_id)
  ]);
  const c = course.data || {}, p = parent.data || {};
  const m = i.month.slice(0, 7);
  const sessions = (reports.data || []).filter(r => String(r.session_date).slice(0, 7) === m).length;
  const no = 'KE-' + i.month.slice(0, 4) + i.month.slice(5, 7) + '-' + String(i.id).padStart(4, '0');
  const late = i.status === 'unpaid' && i.due_date && i.due_date < new Date().toISOString().slice(0, 10);
  const paid = i.status === 'paid';
  document.title = (paid ? 'Reçu ' : 'Facture ') + no + ' | KONE.EDUC';
  const stamp = paid ? '<span class="stamp paid">✓ PAYÉE' + (i.paid_at ? ' le ' + dateFr(i.paid_at) : '') + '</span>'
    : i.status === 'pending' ? '<span class="stamp pending">Paiement en cours de vérification</span>'
    : late ? '<span class="stamp late">En retard · à régler</span>' : '<span class="stamp unpaid">À régler</span>';
  const pay = window.KONE_EDUC_PAYMENT || { methods: [] };
  sheet.innerHTML =
    '<div class="top"><div class="brand"><img src="assets/logo/kone-educ-embleme.jpg" alt=""><div><b>KONE.<span>EDUC</span></b><small>Cours particuliers à domicile et en ligne<br>Université Nangui Abrogoua, Abidjan, Côte d’Ivoire<br>WhatsApp : 01 61 70 13 61 · 07 98 06 73 36<br>Entreprise en cours d’immatriculation</small></div></div>'
    + '<div class="doc"><h1>' + (paid ? 'Reçu' : 'Facture') + '</h1><div class="no">N° ' + no + '</div><small>Émise le ' + dateFr(i.created_at) + '</small>'
    + (i.due_date && !paid ? '<small>Échéance : ' + dateFr(i.due_date) + '</small>' : '') + stamp + '</div></div>'
    + '<div class="parties"><div><h2>Facturé à</h2><p><b>' + safe(p.full_name || 'Parent') + '</b>' + (p.phone ? '<br>' + safe(p.phone) : '') + '</p></div>'
    + '<div><h2>Élève</h2><p><b>' + safe(c.student_name) + '</b><br>' + safe(c.school_level) + ' · ' + safe(c.location) + '</p></div></div>'
    + '<table><thead><tr><th>Désignation</th><th class="num">Montant</th></tr></thead><tbody><tr><td><b>Cours particuliers de ' + safe(c.subject) + ' — ' + monthFr(i.month) + '</b><br><small>'
    + safe(c.format) + ' · ' + safe(c.availability) + (sessions ? ' · ' + sessions + ' séance(s) suivie(s) avec compte rendu' : '') + '</small></td><td class="num"><b>' + fcfa(i.amount) + '</b></td></tr></tbody></table>'
    + '<div class="total"><div><span>Total ' + (paid ? 'payé' : 'à payer') + '</span><span>' + fcfa(i.amount) + '</span></div></div>'
    + (paid
      ? '<div class="pay"><h2>Paiement reçu</h2><p style="margin:0">Réglé' + (i.payment_method ? ' par ' + METHOD[i.payment_method] : '') + (i.payment_reference ? ' · référence ' + safe(i.payment_reference) : '') + '. Merci pour votre confiance !</p></div>'
      : '<div class="pay"><h2>Comment payer ?</h2><ul>' + pay.methods.map(x => '<li><b>' + safe(x.label) + '</b> : ' + safe(x.number) + '</li>').join('') + '</ul><p style="margin:8px 0 0">Envoyez le montant exact, puis indiquez la référence de la transaction dans <b>« Mes paiements »</b> sur kone-educ.vercel.app.</p></div>')
    + '<div class="foot">KONE.EDUC — L’excellence à domicile · Document généré le ' + dateFr(new Date().toISOString()) + '</div>';
  msg.hidden = true; sheet.hidden = false;
})();
</script></body></html>
