<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Parent | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#1559eb;--ink:#102149;--paper:#f5f9ff;--line:#dbe5f5}body{margin:0;background:var(--paper);font:16px Arial;color:var(--ink)}main{max-width:1000px;margin:auto;padding:30px}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.row{padding:15px;border-top:1px solid var(--line)}.notice{border-left:4px solid var(--blue);background:#eef4ff;margin:12px 0;padding:12px 14px;border-radius:7px}.tag{float:right;padding:5px 8px;border-radius:12px;color:#a65d00;background:#fff0dc;font-size:11px;font-weight:bold}.btn{display:inline-block;margin-top:15px;padding:12px;border-radius:8px;color:#fff;background:var(--blue);text-decoration:none;font-weight:bold}a{color:var(--blue);font-weight:bold;text-decoration:none}small{color:#60709a}</style></head><body><main><a href="index.html">← Accueil</a><h1>Mon espace Parent</h1><p id="message">Chargement de vos demandes...</p><section class="card"><h2>Mes notifications</h2><div id="notifications">Chargement...</div></section><section class="card"><h2>Mes demandes de cours</h2><div id="list"></div><a class="btn" href="reservation.html">Nouvelle demande de cours</a></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){message.textContent='Connectez-vous pour voir vos demandes.';return}const[r,n]=await Promise.all([db.from('course_requests').select('*').eq('parent_id',user.id).order('created_at',{ascending:false}),db.from('notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false})]);if(r.error){message.textContent='Erreur : '+r.error.message;return}message.textContent=r.data.length+' demande(s) enregistrée(s).';list.innerHTML=r.data.map(x=>'<div class="row"><span class="tag">'+safe(x.status)+'</span><b>'+safe(x.student_name)+' · '+safe(x.subject)+'</b><br><small>'+safe(x.school_level)+' · '+safe(x.location)+' · '+safe(x.format)+'</small><p>'+safe(x.availability)+'</p></div>').join('')||'Aucune demande pour le moment.';notifications.innerHTML=n.error?'Les notifications seront disponibles après la configuration.':n.data.map(x=>'<div class="notice"><b>'+safe(x.title)+'</b><br><small>'+safe(x.body)+'</small></div>').join('')||'Aucune nouvelle notification.'}load()</script></body></html>
