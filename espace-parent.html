<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Parent | KONE.EDUC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KONE.EDUC"><meta name="theme-color" content="#1559eb"><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#1559eb;--ink:#102149;--paper:#f5f9ff;--line:#dbe5f5}body{margin:0;background:var(--paper);font:16px Arial;color:var(--ink)}main{max-width:1000px;margin:auto;padding:30px}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.row{padding:15px;border-top:1px solid var(--line)}.notice{border-left:4px solid var(--blue);background:#eef4ff;margin:12px 0;padding:12px 14px;border-radius:7px}.tag{float:right;padding:5px 8px;border-radius:12px;color:#a65d00;background:#fff0dc;font-size:11px;font-weight:bold}.btn{display:inline-block;margin-top:15px;padding:12px;border-radius:8px;color:#fff;background:var(--blue);text-decoration:none;font-weight:bold}a{color:var(--blue);font-weight:bold;text-decoration:none}small{color:#60709a}.cancel{margin:4px 0 0;padding:7px 11px;border:1px solid #f1c7c2;border-radius:8px;background:#fff;color:#b42318;font:bold 13px Arial;cursor:pointer}.notice.read{border-left-color:#c9d3e6;background:#f6f8fc}.new{display:inline-block;padding:2px 7px;border-radius:99px;background:#fa7518;color:#fff;font-size:11px;font-weight:bold}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body><main><button type="button" onclick="db.auth.signOut().then(()=>location.href='connexion.html')" style="float:right;padding:8px 12px;border:1px solid #dbe5f5;border-radius:8px;background:#fff;color:#102149;font:bold 14px Arial;cursor:pointer">Se déconnecter</button><a href="index.html">← Accueil</a><h1>Mon espace Parent</h1><p id="message">Chargement de vos demandes...</p><p><a class="btn" href="paiements.html" style="margin-top:0">💳 Mes paiements</a></p><section class="card"><h2>Mes notifications</h2><div id="notifications">Chargement...</div></section><section class="card"><h2>Mes demandes de cours</h2><div id="list"></div><a class="btn" href="reservation.html">Nouvelle demande de cours</a></section></main><script>const statusFr={pending:'En attente',assigned:'Enseignant attribué',completed:'Terminé',cancelled:'Annulé'};const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){message.textContent='Connectez-vous pour voir vos demandes.';return}const[r,n]=await Promise.all([db.from('course_requests').select('*').eq('parent_id',user.id).order('created_at',{ascending:false}),db.from('notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false})]);if(r.error){message.textContent='Erreur : '+r.error.message;return}message.textContent=r.data.length+' demande(s) enregistrée(s).';list.innerHTML=r.data.map(x=>'<div class="row"><span class="tag">'+safe(statusFr[x.status]||x.status)+'</span><b>'+safe(x.student_name)+' · '+safe(x.subject)+'</b><br><small>'+safe(x.school_level)+' · '+safe(x.location)+' · '+safe(x.format)+'</small><p>'+safe(x.availability)+'</p>'+(x.status==='pending'?'<button type="button" class="cancel" onclick="cancelRequest('+x.id+')">Annuler la demande</button>':'')+(x.teacher_id&&x.status!=='cancelled'?'<a href="suivi.html?cours='+x.id+'">📈 Suivi des séances</a> · <a href="messagerie.html?cours='+x.id+'">💬 Écrire à l\'enseignant</a>':'')+'</div>').join('')||'Aucune demande pour le moment.';notifications.innerHTML=n.error?'Les notifications seront disponibles après la configuration.':n.data.slice(0,10).map(x=>'<div class="notice'+(x.is_read?' read':'')+'">'+(x.is_read?'':'<span class="new">Nouveau</span> ')+'<b>'+safe(x.title)+'</b> <small>· '+new Date(x.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</small><br><small>'+safe(x.body)+'</small></div>').join('')||'Aucune notification pour le moment.';if(!n.error&&n.data.some(x=>!x.is_read))db.from('notifications').update({is_read:true}).eq('recipient_id',user.id).eq('is_read',false).then(()=>document.dispatchEvent(new Event('ke-notifications-read')))}async function cancelRequest(id){if(!confirm('Annuler cette demande de cours ?'))return;const r=await db.from('course_requests').update({status:'cancelled'}).eq('id',id);if(r.error){alert('Annulation impossible : '+r.error.message);return}load()}load()</script><script src="app.js"></script></body></html>
