<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Parent | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9ff;font:16px Arial;color:#102149}main{max-width:1000px;margin:auto;padding:30px}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.row{padding:15px;border-top:1px solid #dbe5f5}.tag{float:right;padding:5px 8px;border-radius:12px;color:#a65d00;background:#fff0dc;font-size:11px;font-weight:bold}.btn{display:inline-block;margin-top:15px;padding:12px;border-radius:8px;color:#fff;background:#1559eb;text-decoration:none;font-weight:bold}a{color:#1559eb;font-weight:bold;text-decoration:none}</style></head><body><main><a href="index.html">← Accueil</a><h1>Mon espace Parent</h1><p id="message">Chargement de vos demandes...</p><section class="card"><h2>Mes demandes de cours</h2><div id="list"></div><a class="btn" href="reservation.html">Nouvelle demande de cours</a></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);async function load(){const{data:{user}}=await db.auth.getUser();if(!user){message.textContent='Connectez-vous pour voir vos demandes.';return}const r=await db.from('course_requests').select('*').eq('parent_id',user.id).order('created_at',{ascending:false});if(r.error){message.textContent='Erreur : '+r.error.message;return}message.textContent=r.data.length+' demande(s) enregistrée(s).';list.innerHTML=r.data.map(x=>'<div class="row"><span class="tag">'+x.status+'</span><b>'+x.student_name+' · '+x.subject+'</b><br><small>'+x.school_level+' · '+x.location+' · '+x.format+'</small><p>'+x.availability+'</p></div>').join('')||'Aucune demande pour le moment.'}load()</script></body></html>
