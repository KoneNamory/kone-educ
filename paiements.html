<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes paiements | KONE.EDUC</title><script src="supabase-config.js"></script><script src="payment-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1559eb;--ink:#102149;--paper:#f5f9ff;--line:#dbe5f5;--wave:#1dc8f2;--orange:#ff7900}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px Arial;color:var(--ink)}main{max-width:900px;margin:auto;padding:30px}a{color:var(--blue);font-weight:bold;text-decoration:none}small{color:#60709a}.card{background:#fff;padding:22px;margin:15px 0;border-radius:14px}.invoice{padding:18px 0;border-top:1px solid var(--line)}.invoice:first-child{border-top:0}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.amount{font-size:22px;font-weight:bold}.tag{display:inline-block;padding:5px 9px;border-radius:12px;font-size:12px;font-weight:bold;color:#a65d00;background:#fff0dc}.tag.pending{color:#1559eb;background:#eef4ff}.tag.paid{color:#11743a;background:#e7f8ec}.pay{margin-top:14px;padding:16px;border-radius:10px;background:var(--paper)}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}.method{padding:14px;border-radius:10px;background:#fff;border:2px solid var(--line)}.method h4{margin:0 0 6px}.method.wave h4{color:#0b8db0}.method.orange_money h4{color:#d95f00}.method.moov_money h4{color:#0058a3}.btn{display:inline-block;margin-top:8px;padding:10px 14px;border:0;border-radius:8px;color:#fff;background:var(--blue);font-weight:bold;cursor:pointer}.btn.wave{background:var(--wave);color:#06323d}label{display:block;margin-top:10px;font-weight:bold;font-size:14px}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:7px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.methods{grid-template-columns:1fr}}@media(max-width:600px){main{padding:20px 16px}.row{grid-template-columns:1fr}}
</style></head><body><main><a href="espace-parent.html">← Mon espace Parent</a><h1>Mes paiements</h1><p id="message">Chargement de vos factures...</p><section class="card" id="box" hidden><div id="list"></div></section></main>
<script>
const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),pay=window.KONE_EDUC_PAYMENT||{};let user;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa=n=>Number(n).toLocaleString('fr-FR')+' FCFA',month=d=>new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const statusLabel={unpaid:['À payer',''],pending:['Paiement en vérification','pending'],paid:['Payée','paid']},methodLabel={wave:'Wave',orange_money:'Orange Money',moov_money:'Moov Money'};
function instructions(i){const methods=pay.methods||[];return'<div class="pay"><b>1. Payez '+fcfa(i.amount)+'</b><div class="methods">'+methods.map(m=>'<div class="method '+m.id+'"><h4>'+safe(m.label)+'</h4>'+safe(m.how)+' <b>'+safe(m.number)+'</b> ('+safe(pay.name)+').</div>').join('')+'</div><b>2. Indiquez votre paiement</b><form data-id="'+i.id+'"><div class="row"><label>Moyen utilisé<select name="method" required>'+methods.map(m=>'<option value="'+m.id+'">'+safe(m.label)+'</option>').join('')+'</select></label><label>Référence de la transaction<input name="reference" required maxlength="100" placeholder="Référence reçue par SMS"></label></div><button class="btn">J’ai payé</button></form></div>'}
async function load(){const x=await db.auth.getUser();user=x.data.user;if(!user){message.innerHTML='<a href="connexion.html">Connectez-vous</a> pour voir vos factures.';return}const r=await db.from('invoices').select('*, course_requests(subject, student_name)').eq('parent_id',user.id).order('month',{ascending:false});if(r.error){message.textContent='Les paiements seront disponibles prochainement.';return}const due=r.data.filter(i=>i.status==='unpaid');message.textContent=due.length?due.length+' facture(s) à payer · total '+fcfa(due.reduce((s,i)=>s+i.amount,0)):'Vous êtes à jour de vos paiements. Merci !';box.hidden=false;list.innerHTML=r.data.map(i=>{const[l,c]=statusLabel[i.status];const course=i.course_requests?safe(i.course_requests.subject)+' · '+safe(i.course_requests.student_name):'Cours';return'<div class="invoice"><div class="head"><div><b>'+course+'</b><br><small>Mois de '+month(i.month)+'</small></div><div style="text-align:right"><div class="amount">'+fcfa(i.amount)+'</div><span class="tag '+c+'">'+l+'</span></div></div>'+(i.status==='unpaid'?instructions(i):i.status==='pending'?'<p><small>Déclaré via '+safe(methodLabel[i.payment_method])+' · réf. '+safe(i.payment_reference)+'. Nous confirmons votre paiement sous peu.</small></p>':'<p><small>Payée le '+new Date(i.paid_at).toLocaleDateString('fr-FR')+(i.payment_method?' via '+safe(methodLabel[i.payment_method]):'')+'.</small></p>')+'</div>'}).join('')||'<p>Aucune facture pour le moment.</p>'}
list.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;const r=await db.from('invoices').update({status:'pending',payment_method:f.method.value,payment_reference:f.reference.value.trim()}).eq('id',f.dataset.id);if(r.error){b.disabled=false;message.textContent='Erreur : '+r.error.message;return}load()});
load();
</script></body></html>
