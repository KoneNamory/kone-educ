<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9ff;font:16px Arial;color:#102149}main{max-width:700px;margin:auto;padding:32px 22px}.card{background:#fff;padding:24px;border-radius:16px}label{display:block;margin-top:15px;font-weight:bold}input,select,textarea{box-sizing:border-box;width:100%;margin-top:6px;padding:11px;border:1px solid #dbe5f5;border-radius:8px;font:inherit}button{margin-top:20px;padding:12px 16px;border:0;border-radius:8px;background:#1559eb;color:#fff;font-weight:bold;cursor:pointer}a{color:#1559eb;font-weight:bold;text-decoration:none}</style></head><body><main><a href="espace-admin.html">← Administration</a><h1>Publier un document</h1><section class="card"><form id="form"><label>Titre<input id="title" required></label><label>Description<textarea id="description"></textarea></label><label>Destinataires<select id="audience"><option value="all">Parents et enseignants</option><option value="parent">Parents uniquement</option><option value="teacher">Enseignants uniquement</option></select></label><label>Fichier<input id="file" type="file" required></label><button>Publier</button></form><p id="msg"></p></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey);form.onsubmit=async e=>{e.preventDefault();const f=file.files[0],path=audience.value+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),up=await db.storage.from('documents').upload(path,f);if(up.error){msg.textContent=up.error.message;return}const r=await db.from('documents').insert({title:title.value,description:description.value,audience:audience.value,storage_path:path,file_name:f.name});msg.textContent=r.error?r.error.message:'Document publié avec succès.';if(!r.error)form.reset()}</script></body></html>
