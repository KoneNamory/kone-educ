<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents | KONE.EDUC</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9ff;font:16px Arial;color:#102149}main{max-width:700px;margin:auto;padding:32px 22px}.card{background:#fff;padding:24px;border-radius:16px}label{display:block;margin-top:15px;font-weight:bold}input,select,textarea{box-sizing:border-box;width:100%;margin-top:6px;padding:11px;border:1px solid #dbe5f5;border-radius:8px;font:inherit}button{margin-top:20px;padding:12px 16px;border:0;border-radius:8px;background:#1559eb;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.65;cursor:wait}a{color:#1559eb;font-weight:bold;text-decoration:none}.status{display:none;margin-top:16px;padding:12px;border-radius:8px;font-weight:bold}.status.show{display:block}.status.ok{color:#126b35;background:#e7f8ec}.status.err{color:#9b1c1c;background:#feecec}</style></head><body><main><a href="espace-admin.html">← Administration</a><h1>Publier un document</h1><section class="card"><form id="upload-form"><label>Titre<input id="title" required></label><label>Description<textarea id="description"></textarea></label><label>Destinataires<select id="audience"><option value="all">Parents et enseignants</option><option value="parent">Parents uniquement</option><option value="teacher">Enseignants uniquement</option></select></label><label>Fichier<input id="file" type="file" required></label><button id="publish" type="submit">Publier</button></form><p id="msg" class="status" role="status"></p></section></main><script>const db=supabase.createClient(KONE_EDUC_SUPABASE.url,KONE_EDUC_SUPABASE.publishableKey),form=document.getElementById('upload-form'),msg=document.getElementById('msg'),button=document.getElementById('publish');const show=(text,type)=>{msg.textContent=text;msg.className='status show '+type};form.addEventListener('submit',async e=>{e.preventDefault();const selectedFile=document.getElementById('file').files[0];if(!selectedFile){show('Choisissez un fichier.','err');return}button.disabled=true;button.textContent='Envoi en cours…';show('Téléversement du document…','ok');try{const auth=await db.auth.getUser();if(!auth.data.user)throw new Error('Connectez-vous avec le compte Administrateur.');const profile=await db.from('profiles').select('role').eq('id',auth.data.user.id).single();if(profile.data?.role!=='admin')throw new Error('Seul le compte Administrateur peut publier.');const path=document.getElementById('audience').value+'/'+crypto.randomUUID()+'-'+selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');const upload=await db.storage.from('documents').upload(path,selectedFile);if(upload.error)throw upload.error;const saved=await db.from('documents').insert({title:document.getElementById('title').value,description:document.getElementById('description').value,audience:document.getElementById('audience').value,storage_path:path,file_name:selectedFile.name});if(saved.error)throw saved.error;show('Document publié avec succès. Il est maintenant disponible dans les ressources.','ok');form.reset()}catch(error){show('Erreur : '+error.message,'err')}finally{button.disabled=false;button.textContent='Publier'}})</script></body></html>
